name: Build APK from ZIP

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Repo download
        uses: actions/checkout@v4

      - name: ZIP dhundo aur extract karo
        shell: bash
        run: |
          set -e
          ZIP=""
          if [ -f "V_Client_Unified_Source.zip" ]; then
            ZIP="V_Client_Unified_Source.zip"
          else
            ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$ZIP" ]; then
            echo "::error::Repo ke root mein koi .zip file nahi mili."
            exit 1
          fi
          echo "ZIP file: $ZIP"
          mkdir -p src
          unzip -q -o "$ZIP" -d src
          GRADLE_FILE=$(find src -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::Zip ke andar settings.gradle.kts nahi mili."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project folder: $PROJECT_DIR"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (machine mein pehle se hai)
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK folder: $SDK"
          ls "$SDK" || true
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            echo "::error::sdkmanager nahi mila: $SDKM"
            exit 1
          fi
          set +e
          yes | "$SDKM" --licenses > /dev/null 2>&1
          set -e
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Debug APK banao
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: gradle assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: APK upload
        uses: actions/upload-artifact@v4
        with:
          name: V-Client-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Logs upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          if-no-files-found: ignore
